name: SEO audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI számára friss, üres adatbázis — a seed létrehozza a minta tartalmat,
      # így az audit a valódi (cikk/kategória/címke) oldalakat tudja ellenőrizni.
      DATABASE_URL: 'file:./prisma/ci.db'
      ADMIN_EMAIL: 'ci@example.com'
      ADMIN_PASSWORD: 'ci-password'
      # Az ütemezett link-ellenőrzés ne induljon be a CI szerverén
      LINKCHECK_SCHEDULE_ENABLED: '0'
      SEO_AUDIT_BASE_URL: 'http://localhost:3000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Függőségek
        run: npm ci

      - name: Adatbázis és minta tartalom
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Build
        run: npm run build

      - name: Szerver indítása
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "A szerver nem indul el 30 másodperc alatt" >&2
          exit 1

      - name: SEO audit
        run: npm run seo:audit
